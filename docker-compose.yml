services:
  postgres:
    image: postgres:17-alpine
    container_name: whmb-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: whmb
      POSTGRES_PASSWORD: whmb
      POSTGRES_DB: whmb
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U whmb -d whmb"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
